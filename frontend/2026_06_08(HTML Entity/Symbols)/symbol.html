<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre>
    1. Less Than =>  &lt;
    2. Greater Than =>  &gt;
    4. Ampersand  =>  &amp;
    </pre>
    <table border>
        <tr> <td>
                Character
            </td>
            <td>
                Entity Name
           </td>
            <td>
                Entity Number
            </td>
            <td>
                Output
            </td>
        </tr>
        <tr>
        <td>Less than</td>
        <td>&amp;lt;</td>
        <td>&amp;#60;</td>
        <td>&lt;</td>
        </tr>
        <tr>
        <td>Greater Than</td>
        <td>&amp;gt;</td>
        <td>&amp;#62;</td>
        <td>&gt;</td>
        </tr>
        <tr>
            <td>Ampersand</td>
            <td>&amp;amp;</td>
            <td>&amp;#38;</td>
            <td>&amp;</td>
        </tr>
        <tr>
            <td>Double Quote</td>
            <td>&quot;</td>
        </tr>
    </table>
</body>
</html>
